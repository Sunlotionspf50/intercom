<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f2">
    <meta name="color-scheme" content="light">
    <title>Door access</title>
  </head>
  <body>
    <main class="shell">
      <article class="access-panel" aria-labelledby="app-title">
        <h1 id="app-title">Door access</h1>
        <form id="login-form" class="access-form">
          <label class="visually-hidden" for="access-code">Access code</label>
          <input
            id="access-code"
            name="code"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            placeholder="Access code"
            enterkeyhint="go"
            required
          >
          <button id="login-button" class="visually-hidden" type="submit">Start timer</button>
        </form>
        <div class="timer-block" aria-live="polite">
          <span id="timer-label">Ready</span>
          <time id="session-time" datetime="PT0S">--:--</time>
        </div>
        <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      </article>
    </main>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
